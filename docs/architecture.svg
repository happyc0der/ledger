<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="-apple-system, Segoe UI, Inter, sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker></defs>
  <style>.box{fill:#161a21;stroke:#3a4250;rx:8} .t{fill:#e6e9ef;font-weight:600} .s{fill:#8a93a3} .code{fill:#7aa2f7;font-family:ui-monospace,monospace;font-size:11px} .arrow{stroke:#8a93a3;stroke-width:1.5;fill:none;marker-end:url(#a)}</style>
  <rect width="980" height="420" fill="#0f1115"/>
  <!-- CRM -->
  <rect class="box" x="20" y="60" width="150" height="90"/><text class="t" x="95" y="90" text-anchor="middle">CRM export</text><text class="s" x="95" y="110" text-anchor="middle">HubSpot / Salesforce</text><text class="code" x="95" y="130" text-anchor="middle">ingest · attribution</text>
  <!-- rules -->
  <rect class="box" x="220" y="20" width="160" height="70"/><text class="t" x="300" y="45" text-anchor="middle">CRM rules</text><text class="s" x="300" y="65" text-anchor="middle">fields only · S1–S8</text><text class="code" x="300" y="80" text-anchor="middle">rules.py</text>
  <!-- model reads -->
  <rect class="box" x="220" y="120" width="160" height="90"/><text class="t" x="300" y="145" text-anchor="middle">Model reads</text><text class="s" x="300" y="165" text-anchor="middle">claim ledger · verbatim quotes</text><text class="s" x="300" y="180" text-anchor="middle">PII tokenised · unknown = null</text><text class="code" x="300" y="200" text-anchor="middle">claims.py</text>
  <!-- verifier -->
  <rect class="box" x="430" y="120" width="150" height="90"/><text class="t" x="505" y="145" text-anchor="middle">Verifier</text><text class="s" x="505" y="165" text-anchor="middle">quote exists or claim is null</text><text class="s" x="505" y="180" text-anchor="middle">dates from the record · grades A/B/C</text><text class="code" x="505" y="200" text-anchor="middle">claims.verify</text>
  <!-- compare -->
  <rect class="box" x="630" y="120" width="160" height="90"/><text class="t" x="710" y="145" text-anchor="middle">Code compares</text><text class="s" x="710" y="165" text-anchor="middle">ledger vs CRM fields · M1–M10</text><text class="s" x="710" y="180" text-anchor="middle">cross-deal per account</text><text class="code" x="710" y="200" text-anchor="middle">consistency.py</text>
  <!-- judge -->
  <rect class="box" x="430" y="20" width="150" height="70"/><text class="t" x="505" y="45" text-anchor="middle">Decision model</text><text class="s" x="505" y="65" text-anchor="middle">p(win) · objection · action</text><text class="code" x="505" y="80" text-anchor="middle">decide.py (Jev | fallback)</text>
  <!-- outputs -->
  <rect class="box" x="840" y="20" width="120" height="190"/><text class="t" x="900" y="45" text-anchor="middle">Receipts</text><text class="s" x="900" y="70" text-anchor="middle">ranked pipeline</text><text class="s" x="900" y="88" text-anchor="middle">issues + quotes</text><text class="s" x="900" y="106" text-anchor="middle">checks run</text><text class="s" x="900" y="124" text-anchor="middle">draft CRM updates</text><text class="s" x="900" y="142" text-anchor="middle">forecast · digest</text><text class="s" x="900" y="160" text-anchor="middle">history · lifecycle</text><text class="code" x="900" y="185" text-anchor="middle">app.py · store.py</text>
  <!-- PRISM -->
  <rect class="box" x="220" y="270" width="570" height="60"/><text class="t" x="505" y="295" text-anchor="middle">PRISM — every model call a trace, every deal a trajectory with check:* steps</text><text class="s" x="505" y="315" text-anchor="middle">guardrail flags · rule scorecards · sessions per rep</text>
  <!-- auditor -->
  <rect class="box" x="220" y="355" width="570" height="50"/><text class="t" x="505" y="377" text-anchor="middle">Auditor — reads PRISM + outputs + CRM, attributes each failure to data / agent / guardrail / instrumentation</text><text class="code" x="505" y="395" text-anchor="middle">audit.py → FINDINGS.md → fix → re-prove</text>
  <!-- arrows -->
  <path class="arrow" d="M170,90 L220,55"/><path class="arrow" d="M170,120 L220,160"/>
  <path class="arrow" d="M380,165 L430,165"/><path class="arrow" d="M580,165 L630,165"/>
  <path class="arrow" d="M380,55 L430,55"/><path class="arrow" d="M580,55 L840,55"/><path class="arrow" d="M790,165 L840,150"/>
  <path class="arrow" d="M300,210 L300,270"/><path class="arrow" d="M505,210 L505,270"/><path class="arrow" d="M710,210 L710,270"/>
  <path class="arrow" d="M505,330 L505,355"/>
  <path class="arrow" d="M790,380 C 900,380 930,260 900,215" stroke-dasharray="4 3"/>
</svg>
